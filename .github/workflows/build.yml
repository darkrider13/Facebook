name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fb-webview-app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish public release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Facebook.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Facebook.apk \
            --title "Latest build #${{ github.run_number }}" \
            --notes "Latest APK (build #${{ github.run_number }}, commit ${{ github.sha }})" \
            --latest
